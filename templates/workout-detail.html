<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{.csrf_token}}">
    <title>Тренировка - Workout Book</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="container">
    <header>
        <div class="header-content">
            <h1><a href="/dashboard.html">💪 Workout Book</a></h1>
            <nav>
                <a href="/dashboard.html">Тренировки</a>
                <a href="#" id="logoutBtn">Выход</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="workout-detail">
            <div class="workout-header">
                <div>
                    <a href="/dashboard.html" class="back-link">← Назад</a>
                    <h2 id="workoutName"></h2>
                    <p id="workoutDate" class="text-muted"></p>
                </div>
                <button class="btn btn-primary" id="addExerciseBtn">+ Добавить упражнение</button>
                <button class="btn btn-danger" id="deleteWorkoutBtn">🗑️ Удалить тренировку</button>
            </div>

            <div id="exercises-list" class="exercises-list">
                <div class="loading">Загрузка...</div>
            </div>
        </div>

        <!-- Модальное окно добавления упражнения -->
        <div id="addExerciseModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Добавить упражнение</h2>

                <!-- Фильтр по типу упражнения -->
                <div class="exercise-filter">
                    <label>
                        <input type="radio" name="exerciseFilter" value="all" checked>
                        Все
                    </label>
                    <label>
                        <input type="radio" name="exerciseFilter" value="strength">
                        Силовые
                    </label>
                    <label>
                        <input type="radio" name="exerciseFilter" value="cardio">
                        Кардио
                    </label>
                </div>

                <div class="form-group">
                    <label for="exerciseSelect">Упражнение</label>
                    <select id="exerciseSelect" required>
                        <option value="">Выберите упражнение</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="exerciseNotes">Заметки</label>
                    <textarea id="exerciseNotes" rows="3"></textarea>
                </div>

                <!-- Форма для силовых упражнений -->
                <div id="strengthForm" style="display: none;">
                    <h3>Подходы</h3>
                    <div id="sets-container"></div>
                    <button type="button" class="btn btn-secondary" id="addSetBtn">+ Добавить подход</button>
                </div>

                <!-- Форма для кардио -->
                <div id="cardioForm" style="display: none;">
                    <div class="form-group">
                        <label for="cardioDistance">Дистанция (км)</label>
                        <input type="number" id="cardioDistance" step="0.1" min="0">
                    </div>
                    <div class="form-group">
                        <label for="cardioDuration">Время (минуты)</label>
                        <input type="number" id="cardioDuration" min="1" required>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelAddExercise">Отмена</button>
                    <button type="button" class="btn btn-primary" id="saveExercise">Сохранить</button>
                </div>
            </div>
        </div>

    </main>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/workouts.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/app.js"></script>
<script>
    const workoutId = new URLSearchParams(window.location.search).get('id');
    if (!workoutId) {
        window.location.href = '/dashboard.html';
    }
</script>
</body>
</html>
